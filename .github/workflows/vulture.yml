name: vulture
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      family:
        default: "repeat"
      duration:
        default: "20400"
concurrency:
  group: vulture
  cancel-in-progress: false
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: cur-${{ github.event.inputs.family || 'repeat' }}-${{ matrix.shard }}-${{ github.run_id }}
          restore-keys: cur-${{ github.event.inputs.family || 'repeat' }}-${{ matrix.shard }}-
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RPC_ETH: ${{ secrets.RPC_ETH }}
          RPC_BSC: ${{ secrets.RPC_BSC }}
          RPC_POLYGON: ${{ secrets.RPC_POLYGON }}
          RPC_BASE: ${{ secrets.RPC_BASE }}
          RPC_ARBITRUM: ${{ secrets.RPC_ARBITRUM }}
          RPC_OPTIMISM: ${{ secrets.RPC_OPTIMISM }}
          RPC_AVAX: ${{ secrets.RPC_AVAX }}
          RPC_SOLANA: ${{ secrets.RPC_SOLANA }}
        run: |
          python -m seedhunter.cli hunt -s ${{ matrix.shard }} \
            -f ${{ github.event.inputs.family || 'repeat' }} \
            -d ${{ github.event.inputs.duration || 20400 }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: cur-${{ github.event.inputs.family || 'repeat' }}-${{ matrix.shard }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.shard }}
          path: data
